# Rate-limit + block known scanner UAs + deny sensitive files (Nginx)
limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s;
map $http_user_agent $bad_ua { default 0; ~*(gobuster|dirbuster|ffuf|feroxbuster|wfuzz|nikto|sqlmap) 1; }
server {
    limit_req zone=perip burst=20 nodelay;
    if ($bad_ua) { return 403; }
    location ~ /\.(git|env|svn|htaccess|htpasswd|DS_Store) { deny all; return 404; }
    location ~* \.(sql|bak|old|zip|tar|gz|log)$ { deny all; return 404; }
    location /admin/ { allow 10.0.0.0/8; deny all; }   # restrict to VPN/internal
}

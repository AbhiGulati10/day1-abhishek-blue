# Example fail2ban filter+jail for 404 floods (save as filter.d/nginx-404-flood.conf)
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD) .*" 404 .*$
ignoreregex =

# jail.local:
# [nginx-404-flood]
# enabled  = true
# port     = http,https
# filter   = nginx-404-flood
# logpath  = /var/log/nginx/access.log
# findtime = 60
# maxretry = 30
# bantime  = 3600
